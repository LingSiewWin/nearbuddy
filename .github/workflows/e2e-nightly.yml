name: e2e-nightly

# Full-stack sandbox run (nearbuddy/e2e/run.ts): near-sandbox, the arena wasm, the solver and the runner together.
# ~4 minutes plus tool installs, so nightly and on demand rather than on every push. E2E_OFFLINE=1 serves the
# Coinbase spot price and the 1Click dry quote from a local stand-in: a third-party outage cannot fail the run.
on:
  workflow_dispatch:
  schedule:
    - cron: "17 19 * * *" # 03:17 UTC+8

permissions:
  contents: read

concurrency:
  group: e2e-nightly
  cancel-in-progress: false

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: nearbuddy
    env:
      NEAR_SANDBOX_VERSION: 2.13.4 # the near-sandbox crate's default in arena/Cargo.lock (0.3.16)
      CARGO_NEAR_VERSION: 0.22.0
      E2E_OFFLINE: "1"
    steps:
      - uses: actions/checkout@v4
      # matches arena/rust-toolchain.toml (its wasm32 target is installed on first use)
      - uses: dtolnay/rust-toolchain@1.93.0
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: nearbuddy/arena
      - name: cache cargo-near
        id: cargo-near
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-near
          key: cargo-near-${{ runner.os }}-${{ env.CARGO_NEAR_VERSION }}
      - name: install cargo-near
        if: steps.cargo-near.outputs.cache-hit != 'true'
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf \
            "https://github.com/near/cargo-near/releases/download/cargo-near-v${CARGO_NEAR_VERSION}/cargo-near-installer.sh" | sh
      - run: cargo near --version
      - name: cache near-sandbox
        id: sandbox
        uses: actions/cache@v4
        with:
          path: ~/.near-sandbox/${{ env.NEAR_SANDBOX_VERSION }}
          key: near-sandbox-Linux-x86_64-${{ env.NEAR_SANDBOX_VERSION }}
      - name: download near-sandbox
        if: steps.sandbox.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.near-sandbox/"$NEAR_SANDBOX_VERSION"
          curl -sfL "https://s3-us-west-1.amazonaws.com/build.nearprotocol.com/nearcore/Linux-x86_64/${NEAR_SANDBOX_VERSION}/near-sandbox.tar.gz" |
            tar xz -C ~/.near-sandbox/"$NEAR_SANDBOX_VERSION" --strip-components 1 Linux-x86_64/near-sandbox
      - run: echo "NEAR_SANDBOX_BIN_PATH=$HOME/.near-sandbox/$NEAR_SANDBOX_VERSION/near-sandbox" >> "$GITHUB_ENV"
      - uses: astral-sh/setup-uv@v10
        with:
          version: "0.13.1"
          working-directory: nearbuddy/agents
      # run.ts runs the runner with agents/.venv/bin/python; uv sync builds that venv from uv.lock
      - run: uv sync --locked --no-dev
        working-directory: nearbuddy/agents
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.3
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('nearbuddy/bun.lock') }}
      - run: bun install --frozen-lockfile
      # logs land under TMPDIR (os.tmpdir() in run.ts) so a failure can upload them
      - run: mkdir -p "$RUNNER_TEMP/e2e" && TMPDIR="$RUNNER_TEMP/e2e" bun run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-logs
          path: ${{ runner.temp }}/e2e/
          retention-days: 7
