name: ci

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bun:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nearbuddy
    env:
      # public testnet RPC for the web build's prerender; no account keys in CI
      NEAR_RPC: https://near-testnet.drpc.org
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.3
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('nearbuddy/bun.lock', 'nearbuddy/web/bun.lock') }}
      - run: bun install --frozen-lockfile
      - run: bun install --frozen-lockfile
        working-directory: nearbuddy/web
      - run: bun run test
      # generated contract types (packages/protocol/src/abi, web/app/lib/abi, agents/arena_types.py) must match
      # abi/*.json; on a diff run `bun run gen:types` and commit
      - run: bun run gen:types && git diff --exit-code -- packages/protocol/src/abi web/app/lib/abi agents/arena_types.py
      - run: bun x tsc --noEmit -p .
      - run: bun run lint
      - run: bun run build
        working-directory: nearbuddy/web
      - run: bun x tsc --noEmit -p .
        working-directory: nearbuddy/web
      - run: bun test app
        working-directory: nearbuddy/web

  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nearbuddy/agents
    steps:
      - uses: actions/checkout@v4
      # uv reads .python-version (3.13) and pyproject.toml; --locked fails when uv.lock is out of date
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3 (no floating v10 tag exists)
        with:
          version: "0.13.1"
          working-directory: nearbuddy/agents
      - run: uv sync --locked
      # same lint and format checks as scripts/check-all.sh py-lint (ruff.toml here also covers ../analysis)
      - run: uv run --locked ruff check . ../analysis
      - run: uv run --locked ruff format --check . ../analysis
      - run: uv run --locked mypy .
      - run: uv run --locked pytest -q

  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nearbuddy/arena
    env:
      CARGO_NEAR_VERSION: 0.22.0 # same as e2e-nightly.yml; run scripts/gen-abi.sh locally with this version
    steps:
      - uses: actions/checkout@v4
      # matches arena/rust-toolchain.toml
      - uses: dtolnay/rust-toolchain@1.93.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            nearbuddy/arena
            nearbuddy/intents-stub
            nearbuddy/contract
      # same checks as scripts/check-all.sh rs-* / stub-tests / vault-tests; --locked fails on a stale Cargo.lock
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      # unit tests only; tests/test_arena_sandbox.rs is #[ignore] and needs cargo-near plus a sandbox download
      - run: cargo test --locked --lib
      # testnet stand-in for intents.near used by the verified-settlement sandbox tests
      - run: cargo fmt --check && cargo clippy --locked --all-targets -- -D warnings && cargo test --locked --lib
        working-directory: nearbuddy/intents-stub
      # vault + guarantor contract (layers 1-2)
      - run: cargo fmt --check && cargo clippy --locked --all-targets -- -D warnings && cargo test --locked --lib
        working-directory: nearbuddy/contract
      - name: cache cargo-near
        id: cargo-near
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-near
          key: cargo-near-${{ runner.os }}-${{ env.CARGO_NEAR_VERSION }}
      - name: install cargo-near
        if: steps.cargo-near.outputs.cache-hit != 'true'
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf \
            "https://github.com/near/cargo-near/releases/download/cargo-near-v${CARGO_NEAR_VERSION}/cargo-near-installer.sh" | sh
      # the committed ABIs (nearbuddy/abi, input of the generated TS/Python types) must match the contracts;
      # on a diff run scripts/gen-abi.sh and commit
      - run: cargo near abi && diff -u ../abi/arena.json target/near/nearbuddy_arena_abi.json
      # gen.ts types an Option field as always present (`T | null`) because serde writes None as null;
      # skip_serializing_if would drop the key instead, and the ABI schema cannot show that
      - run: "! grep -rn skip_serializing_if src ../contract/src"
      - run: cargo near abi && diff -u ../abi/vault.json target/near/nearbuddy_vault_abi.json
        working-directory: nearbuddy/contract

  # Playwright smoke over the built pages. Reads the live testnet arena contract through the public RPC,
  # so it needs the network but no secrets. Not required by the other jobs.
  web-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: false
    defaults:
      run:
        working-directory: nearbuddy/web
    env:
      # fastnear tolerates the first-scan burst (SCAN get_duel views) better than drpc
      NEAR_RPC: https://test.rpc.fastnear.com
      # the default fallback is fastnear too, which turns failover off (web/app/api/near.ts): one 429 failed a view
      NEAR_RPC_FALLBACK: https://near-testnet.drpc.org
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.3
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('nearbuddy/bun.lock', 'nearbuddy/web/bun.lock') }}
      - run: bun install --frozen-lockfile
      - run: bun x playwright install --with-deps chromium
      - run: bun run build
      # playwright.config.ts starts `bun run start -p 3013` itself
      - run: bun x playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: nearbuddy/web/playwright-report/
          retention-days: 7
