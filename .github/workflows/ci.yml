name: ci

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bun:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nearbuddy
    env:
      # public testnet RPC for the web build's prerender; no account keys in CI
      NEAR_RPC: https://near-testnet.drpc.org
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.3
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('nearbuddy/bun.lock', 'nearbuddy/web/bun.lock') }}
      - run: bun install --frozen-lockfile
      - run: bun install --frozen-lockfile
        working-directory: nearbuddy/web
      - run: bun run test
      - run: bun x tsc --noEmit -p .
      - run: bun run lint
      - run: bun run build
        working-directory: nearbuddy/web
      - run: bun x tsc --noEmit -p .
        working-directory: nearbuddy/web
      - run: bun test app
        working-directory: nearbuddy/web

  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nearbuddy/agents
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: nearbuddy/agents/requirements.txt
      - run: pip install -r requirements.txt ruff==0.17.4
      # same lint and format checks as scripts/check-all.sh py-lint (ruff.toml here also covers ../analysis)
      - run: ruff check . ../analysis
      - run: ruff format --check . ../analysis
      - run: pytest -q

  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nearbuddy/arena
    steps:
      - uses: actions/checkout@v4
      # matches arena/rust-toolchain.toml
      - uses: dtolnay/rust-toolchain@1.93.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            nearbuddy/arena
            nearbuddy/intents-stub
      # unit tests only; tests/test_arena_sandbox.rs is #[ignore] and needs cargo-near plus a sandbox download
      - run: cargo test --lib
      # testnet stand-in for intents.near used by the verified-settlement sandbox tests
      - run: cargo test --lib
        working-directory: nearbuddy/intents-stub

  # Playwright smoke over the built pages. Reads the live testnet arena contract through the public RPC,
  # so it needs the network but no secrets. Not required by the other jobs.
  web-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: false
    defaults:
      run:
        working-directory: nearbuddy/web
    env:
      # fastnear tolerates the first-scan burst (SCAN get_duel views) better than drpc
      NEAR_RPC: https://test.rpc.fastnear.com
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.3
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('nearbuddy/bun.lock', 'nearbuddy/web/bun.lock') }}
      - run: bun install --frozen-lockfile
      - run: bun x playwright install --with-deps chromium
      - run: bun run build
      # playwright.config.ts starts `bun run start -p 3013` itself
      - run: bun x playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: nearbuddy/web/playwright-report/
          retention-days: 7
