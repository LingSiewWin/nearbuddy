[package]
name = "nearbuddy-intents-probe"
description = "Sandbox-only caller that makes the arena's verified-settlement calls against the intents stub"
version = "0.1.0"
edition = "2024"
resolver = "3"
rust-version = "1.93"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
near-sdk = "5.29"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true

[lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = ['cfg(near)']
