[mypy]
python_version = 3.13
ignore_missing_imports = True
strict = True
# the gate covers the agents' modules; tests use untyped fakes and are not checked
exclude = ^tests/
# dataset rows and solver/RPC JSON are untyped dicts; Any flows through them by design
warn_return_any = False
disallow_any_generics = False
explicit_package_bases = True
